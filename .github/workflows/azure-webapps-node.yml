name: Azure Web App - Node.js CI/CD

on:
  push:
    branches: ['main']
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy to'
        required: true
        default: 'dev'
        type: choice
        options:
          - dev
          - test
          - prod

env:
  NODE_VERSION: '20.x'
  AZURE_WEBAPP_PACKAGE_PATH: '.'
  ORG_CODE: 'nl'
  PROJECT_NAME: 'omnipost'
  REGION_CODE: 'euw'
  LOCATION: 'westeurope'
  AZURE_SUBSCRIPTION_ID: 'bb4e3882-2079-4bab-8974-611bc0b8bb58'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: omnipost
          POSTGRES_PASSWORD: omnipost
          POSTGRES_DB: omnipost_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U omnipost -d omnipost_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@fe02b34f77f8bc703788d5817da081398fad5dd2 # v4.0.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Cache Next.js build
        uses: actions/cache@v4
        with:
          path: |
            .next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('pnpm-lock.yaml') }}-${{ hashFiles('**/*.ts', '**/*.tsx', '**/*.js', '**/*.jsx') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('pnpm-lock.yaml') }}-
            ${{ runner.os }}-nextjs-

      - name: Install, build, and test
        run: |
          pnpm install --frozen-lockfile
          pnpm exec prisma generate
          pnpm run type-check
          pnpm run lint
          pnpm run build
          pnpm run db:migrate:deploy
          pnpm test
        env:
          APP_COMMIT: ${{ github.sha }}
          APP_ENVIRONMENT: ${{ github.event.inputs.environment || 'dev' }}
          JWT_SECRET: test-secret-key-for-deployment-ci
          DATABASE_URL: postgresql://omnipost:omnipost@localhost:5432/omnipost_ci?sslmode=disable

      - name: Prepare deployment package
        run: |
          # Create deployment directory
          mkdir -p deploy

          # Copy standalone server (includes minimal dependencies)
          cp -r .next/standalone/. deploy/

          # Copy static assets
          mkdir -p deploy/.next/static
          cp -r .next/static/. deploy/.next/static/

          # Copy public directory
          cp -r public deploy/public || true

          # Copy data directory (required for feature flags and configuration)
          cp -r data deploy/data || true

          # Fix package.json start script for standalone mode
          # The standalone build includes a server.js that should be run directly
          if [ -f deploy/package.json ]; then
            # Update the start script to run the standalone server
            node -e "const pkg = require('./deploy/package.json'); pkg.scripts = pkg.scripts || {}; pkg.scripts.start = 'node server.js'; require('fs').writeFileSync('./deploy/package.json', JSON.stringify(pkg, null, 2));"
            echo "✓ Updated package.json start script for standalone mode"
          fi

          # Copy startup script (backup option)
          cp startup.sh deploy/
          chmod +x deploy/startup.sh

          echo "✓ Standalone deployment package contents:"
          find deploy -maxdepth 2 -print | head -20
          echo "✓ Package size:"
          du -sh deploy/

      - name: Zip artifact for deployment
        run: cd deploy && zip -r ../node-app.zip .

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: node-app
          path: node-app.zip

  infrastructure:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    needs: build
    environment: ${{ github.event.inputs.environment || 'dev' }}
    if: ${{ (github.event.inputs.environment || 'dev') == 'dev' }}

    steps:
      - uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@cb79c773a3cfa27f31f25eb3f677781210c9ce3d # v1
        with:
          client-id: 4fc0d52a-718a-49de-a709-a12ad3965d9d
          tenant-id: 9530cd32-9e33-47f0-9247-ed964730b580
          subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        run: terraform -chdir=infra/terraform/env/dev init

      - name: Terraform Format
        run: terraform -chdir=infra/terraform/env/dev fmt -check

      - name: Terraform Validate
        run: terraform -chdir=infra/terraform/env/dev validate

      - name: Terraform Plan
        run: terraform -chdir=infra/terraform/env/dev plan -no-color
        env:
          TF_VAR_sluice_azure_openai_endpoint: ${{ secrets.SLUICE_AZURE_OPENAI_ENDPOINT }}
          TF_VAR_sluice_azure_openai_api_key: ${{ secrets.SLUICE_AZURE_OPENAI_API_KEY }}
          TF_VAR_sluice_api_key: ${{ secrets.SLUICE_API_KEY }}

  deploy:
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-latest
    needs: infrastructure
    environment:
      name: ${{ github.event.inputs.environment || 'dev' }}
      url: ${{ steps.deploy-to-webapp.outputs.webapp-url }}

    steps:
      - uses: actions/checkout@v4
        with:
          path: source

      - name: Setup pnpm
        uses: pnpm/action-setup@fe02b34f77f8bc703788d5817da081398fad5dd2 # v4.0.0
        with:
          package_json_file: source/package.json

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
          cache-dependency-path: source/pnpm-lock.yaml

      - name: Install migration dependencies
        run: pnpm --dir source install --frozen-lockfile --prod --ignore-scripts

      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: node-app

      - name: Azure Login
        uses: azure/login@cb79c773a3cfa27f31f25eb3f677781210c9ce3d # v1
        with:
          client-id: 4fc0d52a-718a-49de-a709-a12ad3965d9d
          tenant-id: 9530cd32-9e33-47f0-9247-ed964730b580
          subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}

      - name: Verify X OAuth Key Vault secrets
        shell: bash
        env:
          KEY_VAULT_NAME: nl-dev-omnipost-kv
          X_CLIENT_ID_SECRET_NAME: X-CLIENT-ID
          X_CLIENT_SECRET_SECRET_NAME: X-CLIENT-SECRET
        run: |
          set -euo pipefail

          for secret_name in "$X_CLIENT_ID_SECRET_NAME" "$X_CLIENT_SECRET_SECRET_NAME"; do
            if ! az keyvault secret show \
              --vault-name "$KEY_VAULT_NAME" \
              --name "$secret_name" \
              --query id \
              --output tsv >/dev/null; then
              echo "::error::Required Key Vault secret '$secret_name' is missing or inaccessible."
              exit 1
            fi
          done

      - name: Apply production database migrations
        shell: bash
        run: |
          DATABASE_URL="$(az keyvault secret show \
            --vault-name nl-dev-omnipost-kv \
            --name omnipost-database-url \
            --query value \
            --output tsv)"
          echo "::add-mask::${DATABASE_URL}"
          DATABASE_URL="${DATABASE_URL}" pnpm --dir source run db:migrate:deploy

      - name: Generate Resource Names
        id: generate-names
        env:
          DEPLOY_ENVIRONMENT: ${{ github.event.inputs.environment || 'dev' }}
        run: |
          chmod +x ./source/infra/naming.sh
          while IFS= read -r line; do
            echo "$line" >> $GITHUB_ENV
          done < <(./source/infra/naming.sh "${{ env.ORG_CODE }}" "$DEPLOY_ENVIRONMENT" "${{ env.PROJECT_NAME }}" "${{ env.REGION_CODE }}")

          if [ "$DEPLOY_ENVIRONMENT" = "dev" ]; then
            echo "APP_NAME=nl-dev-omnipost-web" >> $GITHUB_ENV
            echo "RESOURCE_GROUP=nl-dev-omnipost-rg" >> $GITHUB_ENV
          fi

      - name: Configure X OAuth Key Vault references
        shell: bash
        env:
          KEY_VAULT_NAME: nl-dev-omnipost-kv
          X_CLIENT_ID_SECRET_NAME: X-CLIENT-ID
          X_CLIENT_SECRET_SECRET_NAME: X-CLIENT-SECRET
          X_OAUTH_REDIRECT_URI: https://omnipost.neuralliquid.ai/api/platforms/x/callback
        run: |
          set -euo pipefail

          vault_uri="$(az keyvault show \
            --name "$KEY_VAULT_NAME" \
            --query properties.vaultUri \
            --output tsv)"

          az webapp config appsettings set \
            --name "$APP_NAME" \
            --resource-group "$RESOURCE_GROUP" \
            --settings \
              "X_CLIENT_ID=@Microsoft.KeyVault(SecretUri=${vault_uri}secrets/${X_CLIENT_ID_SECRET_NAME})" \
              "X_CLIENT_SECRET=@Microsoft.KeyVault(SecretUri=${vault_uri}secrets/${X_CLIENT_SECRET_SECRET_NAME})" \
              "X_OAUTH_REDIRECT_URI=${X_OAUTH_REDIRECT_URI}" \
            >/dev/null

          echo "Configured versionless Key Vault references for X OAuth."

      - name: 'Deploy to Azure WebApp'
        id: deploy-to-webapp
        uses: azure/webapps-deploy@657f0700ea5214d56a0400d8ac5e8023c963d25d # v3
        with:
          app-name: ${{ env.APP_NAME }}
          package: node-app.zip

      - name: Verify deployment health
        env:
          EXPECTED_COMMIT: ${{ github.sha }}
          EXPECTED_ENVIRONMENT: ${{ github.event.inputs.environment || 'dev' }}
        run: |
          echo "Waiting 30 seconds for app to start..."
          sleep 30

          APP_URL="https://${{ env.APP_NAME }}.azurewebsites.net"
          echo "Testing health endpoint: ${APP_URL}/api/health"

          MAX_RETRIES=5
          RETRY_COUNT=0

          while [ $RETRY_COUNT -lt $MAX_RETRIES ]; do
            HEALTH_RESPONSE=$(curl --silent --show-error --fail "${APP_URL}/api/health" || true)
            HEALTH_JSON=$(jq -c 'if type == "object" then . else {} end' <<<"$HEALTH_RESPONSE" 2>/dev/null || echo '{}')
            ACTUAL_COMMIT=$(jq -r '.commit // empty' <<<"$HEALTH_JSON")
            ACTUAL_ENVIRONMENT=$(jq -r '.environment // empty' <<<"$HEALTH_JSON")
            VERSION=$(jq -r '.version // empty' <<<"$HEALTH_JSON")
            BUILT_AT=$(jq -r '.builtAt // empty' <<<"$HEALTH_JSON")

            if [ "$ACTUAL_COMMIT" = "$EXPECTED_COMMIT" ] && \
               [ "$ACTUAL_ENVIRONMENT" = "$EXPECTED_ENVIRONMENT" ] && \
              [ -n "$VERSION" ] && [ -n "$BUILT_AT" ]; then
              echo "✅ Health check passed for the expected deployment artifact."
              jq '{status, version, commit, builtAt, environment}' <<<"$HEALTH_JSON"
              exit 0
            else
              RETRY_COUNT=$((RETRY_COUNT + 1))
              echo "⚠️  Attempt $RETRY_COUNT/$MAX_RETRIES: expected $EXPECTED_ENVIRONMENT/$EXPECTED_COMMIT, observed ${ACTUAL_ENVIRONMENT:-missing}/${ACTUAL_COMMIT:-missing}"
              if [ $RETRY_COUNT -lt $MAX_RETRIES ]; then
                echo "Retrying in 10 seconds..."
                sleep 10
              fi
            fi
          done

          echo "❌ Expected deployment artifact was not verified after $MAX_RETRIES attempts"
          echo "Deployment may have issues. Check Azure logs:"
          echo "az webapp log tail --name ${{ env.APP_NAME }} --resource-group ${{ env.RESOURCE_GROUP }}"
          exit 1
